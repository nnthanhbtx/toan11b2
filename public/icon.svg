<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="70%" stop-color="#090a29" />
      <stop offset="100%" stop-color="#020024" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGlow)" />

  <!-- Outer Ring with Tech Accents -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ringGradient)" stroke-width="8" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="16 8" opacity="0.6" />

  <!-- Center Gold Badge -->
  <circle cx="256" cy="256" r="140" fill="url(#goldGradient)" stroke="#fef08a" stroke-width="4" filter="drop-shadow(0 0 20px rgba(234, 179, 8, 0.6))" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#78350f" stroke-width="2" />

  <!-- Text / Dollar Symbol -->
  <text x="256" y="305" font-family="system-ui, sans-serif" font-size="140" font-weight="900" text-anchor="middle" fill="#0f172a">$</text>
  <text x="256" y="440" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#facc15" letter-spacing="4">TRIỆU PHÚ TOÁN 11</text>
</svg>
